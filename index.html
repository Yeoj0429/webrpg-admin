<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WEBRPG! - Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="scanline-overlay"></div>

  <div class="admin-layout">
    <!-- SIDEBAR -->
    <aside class="cyber-sidebar">
      <div class="brand-box">
        <h1>WEBRPG!</h1>
        <p class="brand-sub">ADMIN CONSOLE</p>
      </div>

      <nav class="cyber-nav">
        <button class="nav-btn active" onclick="switchTab('progress', this)">
          <span class="nav-code">01</span> PROGRESS
        </button>
        <button class="nav-btn" onclick="switchTab('analytics', this)">
          <span class="nav-code">02</span> ANALYTICS
        </button>
        <button class="nav-btn" onclick="switchTab('lessons', this)">
          <span class="nav-code">03</span> LESSONS
        </button>
        <button class="nav-btn" onclick="switchTab('quizzes', this)">
          <span class="nav-code">04</span> QUIZZES
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="status-indicator">
          <span class="pulse-dot"></span> ONLINE
        </div>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="cyber-main">
      <header class="cyber-topbar">
        <h2 id="view-title">LEARNER PROGRESS</h2>
        <div class="topbar-stats">
          <div class="mini-stat">
            <span>LESSONS</span>
            <strong>05</strong>
          </div>
          <div class="mini-stat">
            <span>QUIZZES</span>
            <strong>35</strong>
          </div>
        </div>
      </header>

      <!-- TAB 1: LEARNER PROGRESS -->
      <section id="tab-progress" class="tab-panel active">
        <div id="lesson-success-list" class="success-grid"></div>
      </section>

      <!-- TAB 2: LEARNING ANALYTICS -->
      <section id="tab-analytics" class="tab-panel">
        <div class="analytics-grid">
          <div class="cyber-card">
            <h3>AGE GROUPS</h3>
            <div id="age-group-bars" class="bar-chart-list"></div>
          </div>

          <div class="cyber-card">
            <h3>QUIZ & EXAM SCORES</h3>
            <div id="score-comparison-bars" class="bar-chart-list"></div>
          </div>
        </div>
      </section>

      <!-- TAB 3: LESSON MODULES -->
      <section id="tab-lessons" class="tab-panel">
        <div id="lesson-cards-container" class="lesson-cards-grid"></div>
      </section>

      <!-- TAB 4: QUIZ QUESTIONS -->
      <section id="tab-quizzes" class="tab-panel">
        <div class="quiz-controls">
          <div class="selector-group">
            <label>LESSON</label>
            <select id="quiz-lesson-select" class="cyber-select" onchange="loadAssessmentQuestions()"></select>
          </div>
          <div class="selector-group">
            <label>ASSESSMENT</label>
            <select id="quiz-type-select" class="cyber-select" onchange="loadAssessmentQuestions()">
              <option value="pre_test">Pre-Test</option>
              <option value="mission_1">Mission 1</option>
              <option value="mission_2">Mission 2</option>
              <option value="mission_3">Mission 3</option>
              <option value="mission_4">Mission 4</option>
              <option value="mission_5">Mission 5</option>
              <option value="post_test">Post-Test</option>
            </select>
          </div>
        </div>

        <div id="questions-editor-list" class="questions-list"></div>
      </section>
    </main>
  </div>

  <!-- MODAL 1: EDIT LESSON MODULE -->
  <div id="lesson-modal" class="cyber-modal hidden" onclick="if(event.target===this) closeLessonModal()">
    <div class="cyber-modal-content">
      <div class="card-tag" id="modal-lesson-tag">LESSON MODULE</div>
      <h3 style="margin-bottom: 14px;">EDIT LESSON</h3>
      <input type="hidden" id="edit-lesson-id" />
      <label>TITLE</label>
      <input type="text" id="edit-lesson-title" class="cyber-input" />
      <label>CONTENT</label>
      <textarea id="edit-lesson-content" rows="5" class="cyber-input"></textarea>
      <label>XP REWARD</label>
      <input type="number" id="edit-lesson-xp" class="cyber-input" />
      <div class="modal-actions">
        <button class="cyber-btn secondary" onclick="closeLessonModal()">CANCEL</button>
        <button class="cyber-btn primary" onclick="saveLessonEdit()">SAVE</button>
      </div>
    </div>
  </div>

  <!-- MODAL 2: EDIT INDIVIDUAL QUESTION & 4 OPTIONS -->
  <div id="question-modal" class="cyber-modal hidden" onclick="if(event.target===this) closeQuestionModal()">
    <div class="cyber-modal-content">
      <div class="card-tag" id="modal-question-tag">QUESTION EDITOR</div>
      <h3 style="margin-bottom: 14px;">EDIT QUESTION</h3>
      <input type="hidden" id="edit-question-index" />
      <label>QUESTION PROMPT</label>
      <textarea id="edit-question-text" rows="3" class="cyber-input"></textarea>
      <label style="display:block; margin-bottom:8px;">CHOICES (SELECT CORRECT ANSWER)</label>
      <div id="modal-options-container" class="modal-options-list"></div>
      <div class="modal-actions" style="margin-top: 18px;">
        <button class="cyber-btn secondary" onclick="closeQuestionModal()">CANCEL</button>
        <button class="cyber-btn primary" onclick="saveQuestionModal()">SAVE</button>
      </div>
    </div>
  </div>

  <!-- MODAL 3: STATUS NOTIFICATION -->
  <div id="notify-modal" class="cyber-modal hidden" onclick="closeNotifyModal()">
    <div class="cyber-modal-content" style="max-width: 380px; text-align: center;">
      <h3 id="notify-title" style="color: #4AD8F0; margin-bottom: 10px;">SAVED</h3>
      <p id="notify-message" style="margin-bottom: 20px;"></p>
      <button class="cyber-btn primary" onclick="closeNotifyModal()">OK</button>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
