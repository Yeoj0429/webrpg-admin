<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WEBRPG! // Access Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --pal-cyan-light: #8CEEF6;
      --pal-cyan-bright: #4AD8F0;
      --pal-blue-electric: #2696E8;
      --pal-navy-deep: #1B2654;
      --pal-navy-void: #080B1A;
      --pal-purple-neon: #8B4DF2;
      --pal-magenta-neon: #C84BF2;
      --pal-pink-neon: #F288E8;
      --pal-white-soft: #EDE9F7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--pal-navy-void);
      background-image:
        radial-gradient(rgba(74, 216, 240, 0.12) 1px, transparent 1px),
        radial-gradient(circle at 85% 15%, rgba(200, 75, 242, 0.2), transparent 35%),
        radial-gradient(circle at 15% 85%, rgba(38, 150, 232, 0.2), transparent 40%);
      background-size: 24px 24px, 100% 100%, 100% 100%;
      color: var(--pal-white-soft);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 460px;
      background: linear-gradient(180deg, rgba(27, 38, 84, 0.85), rgba(8, 11, 26, 0.96));
      border: 2px solid var(--pal-cyan-bright);
      padding: 34px 30px;
      clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
      box-shadow: 0 0 35px rgba(74, 216, 240, 0.2);
      transition: max-width 0.25s ease;
    }

    .login-card.register-mode {
      max-width: 540px;
    }

    .brand-logo {
      display: inline-block;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.7rem;
      font-weight: 900;
      color: var(--pal-navy-void);
      background: var(--pal-cyan-light);
      padding: 4px 14px;
      letter-spacing: 2px;
      text-shadow: 2px 2px 0px var(--pal-magenta-neon);
      clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
      margin-bottom: 18px;
    }

    .brand-logo span { color: var(--pal-purple-neon); }

    .mode-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .mode-tab {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      padding: 10px;
      background: rgba(8, 11, 26, 0.85);
      border: 1px solid var(--pal-blue-electric);
      color: #a9b5d9;
      cursor: pointer;
      clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%);
      transition: 0.2s;
    }

    .mode-tab.active {
      background: rgba(74, 216, 240, 0.16);
      border-color: var(--pal-cyan-light);
      color: var(--pal-cyan-light);
      box-shadow: 0 0 12px rgba(74, 216, 240, 0.25);
    }

    h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.25rem;
      color: var(--pal-cyan-light);
      letter-spacing: 1.5px;
      margin-bottom: 6px;
    }

    p.sub {
      font-size: 0.92rem;
      color: #a9b5d9;
      margin-bottom: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 14px;
    }

    @media (max-width: 520px) {
      .form-grid { grid-template-columns: 1fr; }
    }

    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--pal-cyan-light);
      margin-bottom: 6px;
    }

    .cp-input {
      width: 100%;
      background: rgba(8, 11, 26, 0.9);
      border: 1px solid var(--pal-blue-electric);
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.05rem;
      padding: 11px 14px;
      margin-bottom: 16px;
      outline: none;
    }

    .cp-input:focus {
      border-color: var(--pal-cyan-light);
      box-shadow: 0 0 12px rgba(74, 216, 240, 0.35);
    }

    .error-msg {
      display: none;
      background: rgba(255, 42, 109, 0.15);
      border-left: 3px solid #ff2a6d;
      color: #ff85a9;
      padding: 10px 12px;
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .login-btn {
      width: 100%;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 2px;
      padding: 14px;
      border: none;
      cursor: pointer;
      background: linear-gradient(90deg, var(--pal-magenta-neon), var(--pal-purple-neon));
      color: #fff;
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%);
      transition: 0.2s;
      margin-top: 4px;
    }

    .login-btn:hover {
      filter: brightness(1.15);
      box-shadow: 0 0 18px rgba(200, 75, 242, 0.5);
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: var(--pal-cyan-bright);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div id="portal-card" class="login-card">
    <div class="brand-logo">WEBRPG<span>!</span></div>

    <div class="mode-tabs">
      <button type="button" id="tab-login" class="mode-tab active" onclick="switchMode('login')">SIGN IN</button>
      <button type="button" id="tab-register" class="mode-tab" onclick="switchMode('register')">REGISTER</button>
    </div>

    <h2 id="portal-heading">ACCESS PORTAL</h2>
    <p id="portal-sub" class="sub">Sign in with your learner or administrator credentials.</p>

    <div id="login-error" class="error-msg">Invalid username or password.</div>

    <!-- SIGN IN FORM -->
    <form id="login-form" onsubmit="handleUnifiedLogin(event)">
      <label>USERNAME OR EMAIL</label>
      <input type="text" id="login-user" class="cp-input" placeholder="Enter username or email" required />

      <label>PASSWORD</label>
      <input type="password" id="login-pass" class="cp-input" placeholder="••••••••" required />

      <button type="submit" id="login-submit-btn" class="login-btn">SIGN IN</button>
    </form>

    <!-- LEARNER REGISTRATION FORM -->
    <form id="register-form" style="display: none;" onsubmit="handleLearnerRegister(event)">
      <div class="form-grid">
        <div>
          <label>FIRST NAME</label>
          <input type="text" id="reg-first" class="cp-input" placeholder="Juan" required />
        </div>
        <div>
          <label>LAST NAME</label>
          <input type="text" id="reg-last" class="cp-input" placeholder="Dela Cruz" required />
        </div>
      </div>

      <div class="form-grid">
        <div>
          <label>USERNAME</label>
          <input type="text" id="reg-username" class="cp-input" placeholder="runner_juan" required />
        </div>
        <div>
          <label>EMAIL</label>
          <input type="email" id="reg-email" class="cp-input" placeholder="juan@email.com" required />
        </div>
      </div>

      <div class="form-grid">
        <div>
          <label>AGE</label>
          <input type="number" id="reg-age" class="cp-input" min="10" max="99" placeholder="15" required />
        </div>
        <div>
          <label>SEX</label>
          <select id="reg-sex" class="cp-input">
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="prefer_not_to_say">Prefer not to say</option>
          </select>
        </div>
      </div>

      <label>BARANGAY (VALENZUELA CITY)</label>
      <select id="reg-location" class="cp-input">
        <option value="">Loading barangays...</option>
      </select>

      <label>PASSWORD (MIN. 6 CHARACTERS)</label>
      <input type="password" id="reg-pass" class="cp-input" minlength="6" placeholder="••••••••" required />

      <button type="submit" id="reg-submit-btn" class="login-btn">CREATE ACCOUNT</button>
    </form>

    <a href="index.html" class="back-link">← RETURN TO GAME WEBSITE</a>
  </div>

  <script>
    // Redirect if already authenticated
    if (sessionStorage.getItem('webrpg_admin_token') || localStorage.getItem('role') === 'admin') {
      window.location.href = 'admin.html';
    } else if (localStorage.getItem('token') && localStorage.getItem('role') === 'learner') {
      window.location.href = 'player-dashboard.html';
    }

    function switchMode(mode) {
      const isLogin = mode === 'login';
      document.getElementById('login-error').style.display = 'none';
      document.getElementById('tab-login').classList.toggle('active', isLogin);
      document.getElementById('tab-register').classList.toggle('active', !isLogin);
      document.getElementById('login-form').style.display = isLogin ? 'block' : 'none';
      document.getElementById('register-form').style.display = isLogin ? 'none' : 'block';
      document.getElementById('portal-card').classList.toggle('register-mode', !isLogin);
      document.getElementById('portal-heading').innerText = isLogin ? 'ACCESS PORTAL' : 'LEARNER REGISTRATION';
      document.getElementById('portal-sub').innerText = isLogin
        ? 'Sign in with your learner or administrator credentials.'
        : 'Create your Valenzuela City learner operative profile.';
    }

    function completeAuthRedirect(data) {
      localStorage.setItem('token', data.token);
      localStorage.setItem('webrpg_token', data.token);
      localStorage.setItem('user_id', String(data.user.user_id));
      localStorage.setItem('username', data.user.username);
      localStorage.setItem('role', data.user.role);

      if (data.user.role === 'admin') {
        sessionStorage.setItem('webrpg_admin_token', data.token);
        sessionStorage.setItem('webrpg_admin_user', data.user.username);
        window.location.href = 'admin.html';
      } else {
        window.location.href = 'player-dashboard.html';
      }
    }

    async function loadLocations() {
      const select = document.getElementById('reg-location');
      try {
        const res = await fetch('/api/locations');
        const data = await res.json();
        if (data.success && data.locations.length) {
          select.innerHTML =
            `<option value="">Select Barangay (Valenzuela City)</option>` +
            data.locations
              .map(l => `<option value="${l.location_id}">${l.barangay_name}</option>`)
              .join('');
        } else {
          select.innerHTML = `<option value="">Valenzuela City</option>`;
        }
      } catch {
        select.innerHTML = `<option value="">Valenzuela City</option>`;
      }
    }

    async function handleUnifiedLogin(e) {
      e.preventDefault();
      const errBox = document.getElementById('login-error');
      const btn = document.getElementById('login-submit-btn');
      errBox.style.display = 'none';
      btn.innerText = 'VERIFYING...';

      const identifier = document.getElementById('login-user').value.trim();
      const password = document.getElementById('login-pass').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier, password })
        });

        const data = await res.json();
        if (res.ok && data.success) {
          completeAuthRedirect(data);
          return;
        } else {
          errBox.innerText = data.message || 'Invalid credentials.';
          errBox.style.display = 'block';
        }
      } catch (err) {
        errBox.innerText = 'Server connection error.';
        errBox.style.display = 'block';
      }
      btn.innerText = 'SIGN IN';
    }

    async function handleLearnerRegister(e) {
      e.preventDefault();
      const errBox = document.getElementById('login-error');
      const btn = document.getElementById('reg-submit-btn');
      errBox.style.display = 'none';
      btn.innerText = 'REGISTERING...';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            first_name: document.getElementById('reg-first').value.trim(),
            last_name: document.getElementById('reg-last').value.trim(),
            username: document.getElementById('reg-username').value.trim(),
            email: document.getElementById('reg-email').value.trim(),
            age: document.getElementById('reg-age').value,
            sex: document.getElementById('reg-sex').value,
            location_id: document.getElementById('reg-location').value || null,
            password: document.getElementById('reg-pass').value
          })
        });

        const data = await res.json();
        if (res.ok && data.success) {
          completeAuthRedirect(data);
          return;
        } else {
          errBox.innerText = data.message || 'Registration failed.';
          errBox.style.display = 'block';
        }
      } catch (err) {
        errBox.innerText = 'Server connection error.';
        errBox.style.display = 'block';
      }
      btn.innerText = 'CREATE ACCOUNT';
    }

    if (new URLSearchParams(window.location.search).get('mode') === 'register') {
      switchMode('register');
    }
    loadLocations();
  </script>
</body>
</html>
