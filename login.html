<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WEBRPG! // Access Terminal</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <style>
    :root {
      --cp-bg: #0b0e1a;
      --cp-surface: #14192d;
      --cp-cyan: #4AD8F0;
      --cp-magenta: #C84BF2;
      --cp-yellow: #FCEE0A;
      --cp-red: #ff2a6d;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #18203c 0%, var(--cp-bg) 70%);
      color: #f2f4f3;
      font-family: 'Rajdhani', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      width: 100%;
      max-width: 480px;
      background: var(--cp-surface);
      border: 1px solid #2b355c;
      border-top: 4px solid var(--cp-cyan);
      padding: 28px;
      box-shadow: 0 0 30px rgba(74, 216, 240, 0.12);
    }
    .auth-brand {
      text-align: center;
      margin-bottom: 20px;
    }
    .auth-brand h1 {
      font-family: 'Orbitron', sans-serif;
      margin: 0;
      font-size: 1.9rem;
      letter-spacing: 2px;
      color: #fff;
    }
    .auth-brand h1 span { color: var(--cp-magenta); }
    .auth-brand p {
      margin: 4px 0 0;
      color: #9aa7cc;
      font-size: 0.95rem;
    }
    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 20px;
    }
    .tab-btn {
      background: #0d1122;
      border: 1px solid #2b355c;
      color: #9aa7cc;
      padding: 10px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }
    .tab-btn.active {
      background: rgba(74, 216, 240, 0.15);
      border-color: var(--cp-cyan);
      color: var(--cp-cyan);
    }
    .field-group { margin-bottom: 14px; }
    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    @media (max-width: 520px) { .field-row { grid-template-columns: 1fr; } }
    label {
      display: block;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.72rem;
      color: var(--cp-cyan);
      margin-bottom: 5px;
      letter-spacing: 0.5px;
    }
    .auth-input {
      width: 100%;
      box-sizing: border-box;
      background: #0b0e1a;
      border: 1px solid #2f3b66;
      color: #fff;
      padding: 10px 12px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 1rem;
    }
    .auth-input:focus {
      outline: none;
      border-color: var(--cp-cyan);
    }
    .submit-btn {
      width: 100%;
      margin-top: 8px;
      padding: 12px;
      background: var(--cp-cyan);
      color: #0b0e1a;
      border: none;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 0.95rem;
      letter-spacing: 1px;
      cursor: pointer;
    }
    .submit-btn.magenta {
      background: var(--cp-magenta);
      color: #fff;
    }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .status-banner {
      display: none;
      padding: 10px 12px;
      margin-bottom: 14px;
      font-size: 0.92rem;
      border-left: 3px solid var(--cp-red);
      background: rgba(255, 42, 109, 0.12);
      color: #ff80a8;
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 16px;
      color: #9aa7cc;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .back-link:hover { color: var(--cp-cyan); }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="auth-brand">
      <h1>WEBRPG<span>!</span></h1>
      <p>Valenzuela City Youth Cyber-Safety Terminal</p>
    </div>

    <div class="auth-tabs">
      <button type="button" id="tab-login" class="tab-btn active" onclick="switchAuthTab('login')">SIGN IN</button>
      <button type="button" id="tab-register" class="tab-btn" onclick="switchAuthTab('register')">NEW OPERATIVE</button>
    </div>

    <div id="auth-alert" class="status-banner"></div>

    <!-- LOGIN FORM -->
    <form id="login-form">
      <div class="field-group">
        <label>USERNAME OR EMAIL</label>
        <input type="text" id="login-identifier" class="auth-input" placeholder="Enter username or email" required />
      </div>
      <div class="field-group">
        <label>PASSWORD</label>
        <input type="password" id="login-password" class="auth-input" placeholder="••••••••" required />
      </div>
      <button type="submit" id="login-submit" class="submit-btn">INITIALIZE SESSION</button>
    </form>

    <!-- REGISTER FORM -->
    <form id="register-form" style="display: none;">
      <div class="field-row">
        <div class="field-group">
          <label>FIRST NAME</label>
          <input type="text" id="reg-first" class="auth-input" placeholder="Juan" required />
        </div>
        <div class="field-group">
          <label>LAST NAME</label>
          <input type="text" id="reg-last" class="auth-input" placeholder="Dela Cruz" required />
        </div>
      </div>

      <div class="field-row">
        <div class="field-group">
          <label>USERNAME</label>
          <input type="text" id="reg-username" class="auth-input" placeholder="cyber_juan" required />
        </div>
        <div class="field-group">
          <label>EMAIL ADDRESS</label>
          <input type="email" id="reg-email" class="auth-input" placeholder="juan@email.com" required />
        </div>
      </div>

      <div class="field-row">
        <div class="field-group">
          <label>AGE</label>
          <input type="number" id="reg-age" class="auth-input" min="10" max="99" placeholder="15" required />
        </div>
        <div class="field-group">
          <label>SEX</label>
          <select id="reg-sex" class="auth-input">
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="prefer_not_to_say">Prefer not to say</option>
          </select>
        </div>
      </div>

      <div class="field-group">
        <label>BARANGAY (VALENZUELA CITY)</label>
        <select id="reg-location" class="auth-input">
          <option value="">Loading barangays...</option>
        </select>
      </div>

      <div class="field-group">
        <label>PASSWORD (MIN. 6 CHARACTERS)</label>
        <input type="password" id="reg-password" class="auth-input" minlength="6" placeholder="••••••••" required />
      </div>

      <button type="submit" id="reg-submit" class="submit-btn magenta">CREATE OPERATIVE ACCOUNT</button>
    </form>

    <a href="index.html" class="back-link">← Return to Main Portal</a>
  </div>

  <script>
    const alertBox = document.getElementById('auth-alert');

    function showAlert(msg) {
      alertBox.textContent = msg;
      alertBox.style.display = 'block';
    }

    function hideAlert() {
      alertBox.style.display = 'none';
    }

    function switchAuthTab(mode) {
      hideAlert();
      const isLogin = mode === 'login';
      document.getElementById('tab-login').classList.toggle('active', isLogin);
      document.getElementById('tab-register').classList.toggle('active', !isLogin);
      document.getElementById('login-form').style.display = isLogin ? 'block' : 'none';
      document.getElementById('register-form').style.display = isLogin ? 'none' : 'block';
    }

    function saveSessionAndRedirect(data) {
      localStorage.setItem('token', data.token);
      localStorage.setItem('webrpg_token', data.token);
      localStorage.setItem('user_id', String(data.user.user_id));
      localStorage.setItem('username', data.user.username);
      localStorage.setItem('role', data.user.role);

      if (data.user.role === 'admin') {
        localStorage.setItem('adminToken', data.token);
        window.location.replace('admin.html');
      } else {
        window.location.replace('player-dashboard.html');
      }
    }

    // Load Valenzuela Barangays from TiDB
    async function loadLocations() {
      const select = document.getElementById('reg-location');
      try {
        const res = await fetch('/api/locations');
        const data = await res.json();
        if (data.success && data.locations.length) {
          select.innerHTML =
            `<option value="">Select your Barangay</option>` +
            data.locations
              .map((l) => `<option value="${l.location_id}">${l.barangay_name}, ${l.city_name}</option>`)
              .join('');
        } else {
          select.innerHTML = `<option value="">Valenzuela City (General)</option>`;
        }
      } catch {
        select.innerHTML = `<option value="">Valenzuela City (General)</option>`;
      }
    }

    // Handle Login
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();
      const btn = document.getElementById('login-submit');
      btn.disabled = true;
      btn.textContent = 'AUTHENTICATING...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            identifier: document.getElementById('login-identifier').value,
            password: document.getElementById('login-password').value
          })
        });
        const data = await res.json();
        if (!res.ok || !data.success) {
          showAlert(data.message || 'Login failed.');
          return;
        }
        saveSessionAndRedirect(data);
      } catch {
        showAlert('Network error connecting to authentication server.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'INITIALIZE SESSION';
      }
    });

    // Handle Registration
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();
      const btn = document.getElementById('reg-submit');
      btn.disabled = true;
      btn.textContent = 'CREATING ACCOUNT...';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            first_name: document.getElementById('reg-first').value,
            last_name: document.getElementById('reg-last').value,
            username: document.getElementById('reg-username').value,
            email: document.getElementById('reg-email').value,
            age: document.getElementById('reg-age').value,
            sex: document.getElementById('reg-sex').value,
            location_id: document.getElementById('reg-location').value || null,
            password: document.getElementById('reg-password').value
          })
        });
        const data = await res.json();
        if (!res.ok || !data.success) {
          showAlert(data.message || 'Registration failed.');
          return;
        }
        saveSessionAndRedirect(data);
      } catch {
        showAlert('Network error while creating account.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'CREATE OPERATIVE ACCOUNT';
      }
    });

    // Redirect if already logged in
    const existingRole = localStorage.getItem('role');
    const existingToken = localStorage.getItem('token');
    if (existingToken && existingRole === 'admin') window.location.replace('admin.html');
    if (existingToken && existingRole === 'learner') window.location.replace('player-dashboard.html');

    // Open register tab directly if ?mode=register is in URL
    if (new URLSearchParams(window.location.search).get('mode') === 'register') {
      switchAuthTab('register');
    }

    loadLocations();
  </script>
</body>
</html>
